<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taller de escenarios · L2 Lab</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/atmosphere.css"><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/panel-layout.css"><link rel="stylesheet" href="/surfaces.css"><link rel="stylesheet" href="/asset-library.css"><link rel="stylesheet" href="/studio-controls.css"><script type="importmap">{"imports":{"three":"/assets/vendor/three.module.js","three/addons/":"/assets/vendor/addons/"}}</script></head>
<body>
<header><div class="brand"><span class="mark">L2</span><span><strong>Taller de escenarios</strong><small>L2 Lab · editor visual local</small></span></div><select id="scene" aria-label="Escenario"></select><button id="undo">↶ Deshacer</button><button id="redo" aria-label="Rehacer">↷</button><div id="header-cameras"></div><span class="spacer"></span><button id="new-project">Nuevo proyecto</button><button id="open">Abrir proyecto</button><input id="file" type="file" accept="application/json,.json" hidden><button id="export">Exportar copia</button><button id="save" class="primary">Guardar como…</button></header>
<main><aside class="library"><div class="section-title"><span>Biblioteca</span><small id="asset-count"></small></div><input id="search" type="search" placeholder="Buscar árbol, estatua, nave…" aria-label="Buscar objetos"><select id="filter" aria-label="Filtrar biblioteca"><option value="structures">Estructuras y objetos</option><option value="all">Todo el catálogo</option></select><p class="hint">Elegí un recurso y después pulsá sobre una superficie del escenario para colocarlo.</p><div id="assets"></div><nav id="asset-pages" class="asset-pages" aria-label="Páginas de recursos" hidden></nav></aside>
<section id="viewport"><div id="loading">Cargando escena…</div><div id="placement" hidden></div><p class="help">Arrastrar para orbitar · rueda para acercar</p></section>
<aside class="inspector"><div class="section-title">Detalles</div><div class="tools"><button data-mode="translate" class="active">Mover</button><button data-mode="rotate">Rotar</button><button data-mode="scale">Escalar</button><span class="separator"></span><button id="frame">Encuadrar</button><button id="home">Ver todo</button><label><input id="snap" type="checkbox"> Ajustar</label></div><div id="properties" hidden><label>Nombre<input id="name" maxlength="200"></label><p id="source"></p><label><input id="visible" type="checkbox"> Visible</label><label><input id="locked" type="checkbox"> Bloqueado</label><div id="transform-fields"></div><div class="actions"><button id="duplicate">Duplicar</button><button id="remove" class="danger">Quitar</button><button id="reset-transform">Restaurar</button></div><div class="group-actions"><button id="group-selection">Agrupar</button><button id="ungroup-selection">Desagrupar</button><button id="merge-selection">Fusionar</button></div></div><div id="objects"></div><div class="notes"><label><input id="show-nodes" type="checkbox"> Mostrar nodos</label><small id="object-count"></small></div></aside></main>
<footer><span id="status">Editor preparado.</span><span id="dirty">Sin cambios pendientes</span><span>ENTORNO: LAB</span></footer>
<script type="module" src="/app.js"></script>
</body></html>
