<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Preparación de escenarios L2</title><style>body{font:16px system-ui;background:#111a22;color:#dbe7ee;max-width:1200px;margin:30px auto;padding:20px}a{color:#edc27d}td,th{padding:10px;border-bottom:1px solid #425462;text-align:left}table{width:100%}small{display:block}</style><h1>Preparación de escenarios descargados</h1><p><a href="/?category=Escenarios">Abrir escenarios del visor</a></p><p>Vistas de inspección. Terreno incluido no certifica BSP, efectos, colisiones ni funcionamiento en el juego. Las variantes se mantienen separadas.</p><p id="summary">Cargando…</p><table><thead><tr><th>Escenario</th><th>Estado</th><th>Terreno</th><th>Actores omitidos</th></tr></thead><tbody id="rows"></tbody></table><script>async function update(){try{const r=await fetch('import-progress.json',{cache:'no-store'});const d=await r.json();document.getElementById('summary').textContent=d.available+' disponibles de '+d.total+' mapas/variantes pendientes; '+d.review+' requieren revisión.';const body=document.getElementById('rows');body.replaceChildren();for(const m of d.rows){const row=document.createElement('tr');for(const value of [m.title,m.status,m.terrain===true?'Incluido':m.terrain===false?'Pendiente':'—',m.omitted??'—']){const td=document.createElement('td');td.textContent=value;row.append(td);}if(m.key){const td=row.firstChild;td.replaceChildren();const a=document.createElement('a');a.textContent=m.title;a.href='/?model='+encodeURIComponent(m.key)+'&view=3d';td.append(a);}if(m.error){const small=document.createElement('small');small.textContent=m.error;row.children[1].append(small);}body.append(row);}}catch(e){document.getElementById('summary').textContent='No se pudo consultar el estado.'}}update();setInterval(update,10000)</script></html>
